[package]
name = "loktin-common"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false

[features]
# The resource tests' limits (T10). Only the contracts' tests turn it on, so
# nothing behind it reaches a release Wasm.
testutils = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }
