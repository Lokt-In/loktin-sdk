version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # OpenZeppelin 0.8.0 requires soroban-sdk ^28 (C6).
      - dependency-name: soroban-sdk
        update-types:
          - version-update:semver-major
      - dependency-name: stellar-access
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: stellar-contract-utils
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: stellar-macros
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
