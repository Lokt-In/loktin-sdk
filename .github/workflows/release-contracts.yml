name: Release contracts

on:
  push:
    tags:
      - contracts-v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      STELLAR_CLI_VERSION: 28.1.0
      STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
      SOURCE_REPO: github:Lokt-In/loktin-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - name: Download Stellar CLI
        working-directory: ${{ runner.temp }}
        run: curl -fsSLO "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
      - name: Verify Stellar CLI checksum
        working-directory: ${{ runner.temp }}
        run: echo "${STELLAR_CLI_SHA256}  stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check --strict
      - name: Install Stellar CLI
        working-directory: ${{ runner.temp }}
        run: |
          mkdir stellar-cli
          tar -xzf "stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C stellar-cli stellar
          echo "${RUNNER_TEMP}/stellar-cli" >> "$GITHUB_PATH"
      - name: Build contracts
        run: stellar contract build --locked --meta "source_repo=${SOURCE_REPO}"
      - name: Check metadata and write checksums
        run: |
          mkdir dist
          for name in loktin_target_savings loktin_spend_save; do
            wasm="target/wasm32v1-none/release/${name}.wasm"
            stellar contract info meta --wasm "$wasm"
            if ! stellar contract info meta --wasm "$wasm" --output json \
              | grep -qF "{\"key\":\"source_repo\",\"val\":\"${SOURCE_REPO}\"}"; then
              echo "source_repo is missing from ${wasm}" >&2
              exit 1
            fi
            cp "$wasm" dist/
          done
          cd dist
          sha256sum loktin_target_savings.wasm loktin_spend_save.wasm | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/loktin_target_savings.wasm
            dist/loktin_spend_save.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts-wasm
          path: |
            dist/loktin_target_savings.wasm
            dist/loktin_spend_save.wasm
            dist/SHA256SUMS
          if-no-files-found: error
