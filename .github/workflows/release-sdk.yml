name: Release SDK

on:
  push:
    tags:
      - sdk-v*

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse a tag that is not on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          # Never use caching in release builds.
          package-manager-cache: false
      - name: Check the tag matches the package version
        id: version
        run: |
          version="$(node -p 'require("./packages/sdk/package.json").version')"
          if [ "$GITHUB_REF_NAME" != "sdk-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match sdk-v${version} from packages/sdk/package.json" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Only this job can request the token npm accepts. Of the development
  # tools, it runs only the TypeScript compiler.
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          registry-url: 'https://registry.npmjs.org'
          # Never use caching in release builds.
          package-manager-cache: false
      - name: Check the npm version
        run: |
          version="$(npm --version)"
          echo "npm ${version}"
          lowest="$(printf '%s\n' 11.15.0 "$version" | sort -V | head -n 1)"
          if [ "$lowest" != 11.15.0 ]; then
            echo "npm ${version} is below 11.15.0, which staged publishing needs" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build -w packages/sdk
      - name: Stage the version on npm
        working-directory: packages/sdk
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # An error or empty output means the version is not published.
          published="$(npm view "@loktin/sdk@${VERSION}" version 2>/dev/null || true)"
          if [ "$published" = "$VERSION" ]; then
            echo "@loktin/sdk ${VERSION} is already on npm, so staging is skipped."
          else
            npm stage publish
          fi
      - name: Create a draft GitHub release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## @loktin/sdk ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "CHANGELOG.md has no '## @loktin/sdk ${VERSION}' section, or it is empty" >&2
            exit 1
          fi
          # Versions below 1.0.0 are marked as prereleases.
          prerelease=()
          case "$VERSION" in
            0.* | 1.0.0-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "@loktin/sdk ${VERSION}" \
            --notes-file "$notes" "${prerelease[@]}"
