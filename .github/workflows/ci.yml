name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  node-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  keeper-template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/keeper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: templates/keeper/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: docker build -t loktin-keeper .
      - name: Check the image runs as the node user
        run: |
          uid="$(docker run --rm --entrypoint id loktin-keeper -u)"
          echo "uid ${uid}"
          test "$uid" = 1000
      - name: Check the image refuses missing settings without a network
        run: |
          set +e
          output="$(docker run --rm --init --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges loktin-keeper 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -eq 1
          printf '%s\n' "$output" | grep -q '^keeper settings: set LOKTIN_KEEPER_SECRET_FILE'

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
      - name: Verify checksum
        working-directory: ${{ runner.temp }}
        run: |
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > expected.txt
          sha256sum --check --strict expected.txt
      - name: Extract gitleaks
        working-directory: ${{ runner.temp }}
        run: tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan full history
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --verbose --no-banner --log-opts="--all" .'

  rust:
    runs-on: ubuntu-latest
    env:
      STELLAR_CLI_VERSION: 28.1.0
      STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - name: Download Stellar CLI
        working-directory: ${{ runner.temp }}
        run: curl -fsSLO "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
      - name: Verify Stellar CLI checksum
        working-directory: ${{ runner.temp }}
        run: echo "${STELLAR_CLI_SHA256}  stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check --strict
      - name: Install Stellar CLI
        working-directory: ${{ runner.temp }}
        run: |
          mkdir stellar-cli
          tar -xzf "stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C stellar-cli stellar
          echo "${RUNNER_TEMP}/stellar-cli" >> "$GITHUB_PATH"
      - run: stellar contract build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the committed contract specs
        run: node scripts/extract-spec.mjs --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      STELLAR_CLI_VERSION: 28.1.0
      STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - name: Download Stellar CLI
        working-directory: ${{ runner.temp }}
        run: curl -fsSLO "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
      - name: Verify Stellar CLI checksum
        working-directory: ${{ runner.temp }}
        run: echo "${STELLAR_CLI_SHA256}  stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check --strict
      - name: Install Stellar CLI
        working-directory: ${{ runner.temp }}
        run: |
          mkdir stellar-cli
          tar -xzf "stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -C stellar-cli stellar
          echo "${RUNNER_TEMP}/stellar-cli" >> "$GITHUB_PATH"
      - run: stellar contract build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
